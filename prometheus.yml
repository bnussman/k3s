# Prometheus config

global:
  scrape_interval:     15s # Set the scrape interval to every 15 seconds. Default is every 1 minute.
  evaluation_interval: 15s # Evaluate rules every 15 seconds. The default is every 1 minute.

# Alertmanager configuration
alerting:
  alertmanagers:
  - static_configs:
    - targets: ['localhost:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: traefik
    static_configs:
      - targets: ['192.168.0.114:9100']

  - job_name: cloudflared
    static_configs:
      - targets: ['192.168.0.103:60123']

  - job_name: kubernetes
    scheme: https
    authorization:
      type: Bearer
      credentials: "{{K3S_TOKEN}}"
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ['192.168.0.114:6443']

  - job_name: kubernetes-cadvisor
    scheme: https
    authorization:
      type: Bearer
      credentials: "{{K3S_TOKEN}}"
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ['192.168.0.114:6443']
    metrics_path: /api/v1/nodes/kubernetes/proxy/metrics/cadvisor
